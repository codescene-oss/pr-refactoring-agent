name: PR Refactoring Agent (Example)

# This is an example workflow showing how to trigger the refactoring agent
# from PR comments or manually via workflow_dispatch. Copy this to your repository and customize as needed.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
      command:
        description: 'Command to run'
        required: true

jobs:
  refactor:
    # Only run on PR comments containing /cs-agent, or on workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request != null && contains(github.event.comment.body, '/cs-agent'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run refactoring agent
        uses: codescene-oss/pr-refactoring-agent@v1.0.8
        with:
          pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
          command: ${{ github.event_name == 'workflow_dispatch' && inputs.command || github.event.comment.body }}
          model: 'anthropic/claude-sonnet-4-20250514'
          push: true
          codescene_token: ${{ secrets.CODESCENE_ACCESS_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
